<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbe8"/>
      <stop offset=".45" stop-color="#d7efc4"/>
      <stop offset="1" stop-color="#8fbf6a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#1f4d32" opacity=".14" font-family="Georgia, serif">
    <text x="70" y="120" font-size="64" font-weight="700">THE FIELD</text>
